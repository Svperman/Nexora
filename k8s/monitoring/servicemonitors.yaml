apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nexora-api
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-api }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# Le worker n'a pas de Service : on scrape directement ses pods.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nexora-worker
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-worker }
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
