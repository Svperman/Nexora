apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-worker
  labels: { app.kubernetes.io/name: nexora-worker, app.kubernetes.io/component: worker }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-worker, app.kubernetes.io/component: worker }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: nexora-api # même image que l'API, autre commande
          command: ["node", "--import", "./src/tracing.js", "src/worker.js"]
          env:
            - { name: OTEL_SERVICE_NAME, value: nexora-worker }
          envFrom:
            - configMapRef: { name: nexora-config }
            - secretRef: { name: nexora-secrets }
          ports:
            - { name: metrics, containerPort: 9464 }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
