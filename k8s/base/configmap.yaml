apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-config
data:
  NODE_ENV: production
  PORT: "4000"
  CLIENT_ORIGIN: https://nexora.example.com
  ACCESS_TOKEN_TTL: 15m
  REFRESH_TOKEN_TTL_DAYS: "30"
  LOG_LEVEL: info
  # Traces OpenTelemetry vers le collecteur Jaeger (namespace observability). Vider pour désactiver.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger-collector.observability.svc:4318
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "0.2"
