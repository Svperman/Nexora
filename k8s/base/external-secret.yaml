# Les secrets ne sont jamais dans Git : External Secrets Operator les copie depuis
# le gestionnaire de secrets (Doppler, Vault, AWS/GCP/Azure, 1Password…) vers le Secret "nexora-secrets".
# Le SecretStore "nexora-store" est défini par environnement (voir overlays/*/secret-store.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexora-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: nexora-store
  target:
    name: nexora-secrets
    creationPolicy: Owner
  data:
    - secretKey: MONGO_URI
      remoteRef: { key: MONGO_URI }
    - secretKey: REDIS_URL
      remoteRef: { key: REDIS_URL }
    - secretKey: JWT_ACCESS_SECRET
      remoteRef: { key: JWT_ACCESS_SECRET }
