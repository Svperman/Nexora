# Nécessite metrics-server. L'API peut scaler horizontalement grâce à l'adapter Redis de Socket.IO.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexora-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: nexora-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      # Descente lente : chaque pod retiré coupe ses connexions WebSocket.
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexora-worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: nexora-worker }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
