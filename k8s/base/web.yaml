apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-web
  labels: { app.kubernetes.io/name: nexora-web, app.kubernetes.io/component: web }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-web, app.kubernetes.io/component: web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # utilisateur nginx de nginx-unprivileged
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: nexora-web
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-web
  labels: { app.kubernetes.io/name: nexora-web }
spec:
  selector: { app.kubernetes.io/name: nexora-web }
  ports:
    - { name: http, port: 80, targetPort: http }
