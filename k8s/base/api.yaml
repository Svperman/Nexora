apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-api
  labels: { app.kubernetes.io/name: nexora-api, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-api, app.kubernetes.io/component: api }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: nexora-api }
      containers:
        - name: api
          image: nexora-api
          ports:
            - { name: http, containerPort: 4000 }
          env:
            - { name: OTEL_SERVICE_NAME, value: nexora-api }
          envFrom:
            - configMapRef: { name: nexora-config }
            - secretRef: { name: nexora-secrets }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            # Laisse le temps à l'Ingress de retirer le pod avant SIGTERM.
            preStop:
              exec: { command: ["sleep", "5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-api
  labels: { app.kubernetes.io/name: nexora-api }
spec:
  selector: { app.kubernetes.io/name: nexora-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexora-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-api }
