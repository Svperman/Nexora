apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: nexora
    includeSelectors: false

resources:
  - configmap.yaml
  - external-secret.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - redis.yaml
  - hpa.yaml
  - ingress.yaml
  - networkpolicies.yaml

images:
  - name: nexora-api
    newName: ghcr.io/svperman/nexora-api
    newTag: main
  - name: nexora-web
    newName: ghcr.io/svperman/nexora-web
    newTag: main
