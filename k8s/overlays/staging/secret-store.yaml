# Exemple avec Doppler (gratuit pour un petit projet). Pour un autre fournisseur,
# remplacer le bloc "provider" : https://external-secrets.io/latest/provider/
# Le jeton d'accès Doppler est le SEUL secret créé à la main (voir k8s/README.md).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: nexora-store
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            key: token
