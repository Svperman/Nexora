name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write      # jeton OIDC pour la signature Cosign sans clé (Sigstore)
  attestations: write  # attestation de provenance SLSA

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: nexora-api, context: server }
          - { name: nexora-web, context: client }
    steps:
      - uses: actions/checkout@v4
      # GHCR exige des noms d'image en minuscules (le compte est "Svperman").
      - id: img
        run: echo "repo=ghcr.io/${OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.repo }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true            # SBOM SPDX attaché à l'image
          provenance: mode=max  # provenance BuildKit
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan Trivy de l'image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.img.outputs.repo }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      # Signature et attestation seulement après un scan réussi, sur le digest (jamais sur un tag mutable).
      - uses: sigstore/cosign-installer@v3
      - name: Signature Cosign (keyless, identité OIDC du workflow)
        run: cosign sign --yes "${{ steps.img.outputs.repo }}@${{ steps.build.outputs.digest }}"
      - name: Attestation de provenance SLSA
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.img.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
