server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # NB : un add_header dans un location annule ceux du server => en-têtes inclus dans chaque location.
  location = /healthz { access_log off; return 200 'ok'; }

  # Fichiers fingerprintés par Vite : cache long
  location /assets/ {
    include /etc/nginx/snippets/security.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA : toutes les routes renvoient index.html
  location / {
    include /etc/nginx/snippets/security.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
